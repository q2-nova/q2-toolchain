name: Build the Q2 QEMU asset

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install pinned recipe dependencies
        run: |
          sudo apt-get update
          jq -r '.packages[]' q2/toolchain/qemu-ci.json | xargs sudo apt-get install -y --no-install-recommends
      - name: Build, package and exercise the two emulators
        run: |
          python3 tools/build_qemu_ci.py --out "$RUNNER_TEMP/qemu-out" --work "$RUNNER_TEMP/qemu-work"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qemu-linux-x86_64
          path: |
            ${{ runner.temp }}/qemu-out/qemu-linux-x86_64.tar.gz
            ${{ runner.temp }}/qemu-out/qemu-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
