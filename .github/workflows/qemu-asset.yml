name: Build the Q2 QEMU asset

on:
  push:
    tags:
      - 'qemu-v*-rc.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/qemu-v') || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install pinned recipe dependencies
        run: |
          sudo apt-get update
          jq -r '.packages[]' q2/toolchain/qemu-ci.json | xargs sudo apt-get install -y --no-install-recommends
      - name: Build, package and exercise the two emulators
        run: |
          python3 tools/build_qemu_ci.py --out "$RUNNER_TEMP/qemu-out" --work "$RUNNER_TEMP/qemu-work"
      - name: Publish the verified QEMU prerelease
        if: startsWith(github.ref, 'refs/tags/qemu-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ $GITHUB_REF_NAME =~ ^qemu-v[0-9]+([.][0-9]+){2}-rc[.][0-9]+$ ]]
          bundle="$RUNNER_TEMP/qemu-out"
          (cd "$bundle" && sha256sum -c qemu-linux-x86_64.tar.gz.sha256)
          qemu_commit=$(jq -r '.commit' q2/toolchain/qemu-ci.json)
          printf 'QEMU source: `%s`\n\nBuild recipe: `%s`\n' "$qemu_commit" "$GITHUB_SHA" > "$bundle/notes.md"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --prerelease --title "$GITHUB_REF_NAME" --notes-file "$bundle/notes.md" \
            "$bundle/qemu-linux-x86_64.tar.gz" "$bundle/qemu-linux-x86_64.tar.gz.sha256"
